name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        shell: bash
        run: |
          rc=0
          npm test > /tmp/test.log 2>&1 || rc=$?
          echo "node=$(node -v) kernel=$(uname -sr) cpus=$(nproc)"
          if [ "$rc" -ne 0 ]; then
            grep -A8 "Unhandled Rejection" /tmp/test.log | head -80 \
              | while IFS= read -r l; do echo "::error::$(echo "$l" | sed 's/^[[:space:]]*//; s/%/%25/g')"; done
            grep -E "FAIL |Failed Tests|Errors " /tmp/test.log | head -30 \
              | while IFS= read -r l; do echo "::error::$(echo "$l" | sed 's/^[[:space:]]*//; s/%/%25/g')"; done
            echo "----- last 80 lines of test log -----"
            tail -80 /tmp/test.log
          fi
          exit $rc

      - name: Build
        run: npm run build

      - name: Copy 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
